[project]
name = "nbhf"
version = "0.1.0"
description = "NBHF dolphin click detector (Python port of the Patris Octave detector) and its GUI"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"          # tomllib
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "PySide6-Essentials>=6.8",
]

[project.gui-scripts]
nbhfapp = "nbhfapp.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# only the core and the GUI: research/, tests/, ressources/ (A) stay out
packages = ["nbhf", "nbhfapp"]
exclude = ["nbhfapp/i18n/*.ts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
